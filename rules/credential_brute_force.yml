title: Authentication Failure Event for Brute Force Correlation
id: 6b5dc55c-7e19-4f8e-b1ab-4ab2fa95a361
name: authentication_failure_bf
status: experimental
description: Selects failed authentication events used by the accompanying correlation rule.
author: John Flanagan
date: 2026-09-01
logsource:
    category: authentication
detection:
    selection:
        outcome: failure
    condition: selection
level: informational
---
title: Credential Brute Force Against One Account
id: 53dd5e0d-a248-4559-b62f-0f4f21408370
status: experimental
description: Detects five or more authentication failures against one account from one source in five minutes.
author: John Flanagan
date: 2026-09-01
correlation:
    type: event_count
    rules:
        - authentication_failure_bf
    group-by:
        - source_ip
        - username
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - Users who repeatedly mistype a password
level: high
tags:
    - attack.credential-access
    - attack.t1110
