title: Authentication Failure Event for Password Spray Correlation
id: fd2fdd2a-e644-4494-804b-2522afec32fd
name: authentication_failure_spray
status: experimental
description: Selects failed authentication events used by the accompanying correlation rule.
author: John Flanagan
date: 2026-09-01
logsource:
    category: authentication
detection:
    selection:
        outcome: failure
    condition: selection
level: informational
---
title: Password Spraying From One Source
id: ee802476-87cd-4425-97b3-23dc2a6d6d63
status: experimental
description: Detects authentication failures against five or more distinct accounts from one source in ten minutes.
author: John Flanagan
date: 2026-09-01
correlation:
    type: value_count
    rules:
        - authentication_failure_spray
    group-by:
        - source_ip
    timespan: 10m
    condition:
        gte: 5
        field: username
falsepositives:
    - Misconfigured identity integrations
level: high
tags:
    - attack.credential-access
    - attack.t1110.003
